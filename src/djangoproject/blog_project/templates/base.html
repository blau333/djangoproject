{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{% block title %}}Django blog{% endblock %}</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-extend-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a href="{% url "blog:index" %}" class="navbar-brand">Главная страница</a>
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a href="{% url "blog:categories_list' %}" class="nav-link">все категории</a>
                </li>
                <li class="nav-item">
                    <a href="{% url "blog:post_list' %}" class="nav-link">статьи</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="py-3 py-4">
            <p class="text-center text-muted">Django blog</p>
    </footer>

</body>
</html>
