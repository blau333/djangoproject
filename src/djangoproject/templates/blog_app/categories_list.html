{% extends "base.html" %}
{% block title %}Все категории{% endblock %}
{% block content %}
    <h1>Все категории</h1>
    <ul>
        {% for category in categories %}
            <li><a href="{% url 'blog:category_detail' category.id %}">{{ category.title }}</a></li>
        {% endfor %}
    </ul>

    <div class="mt-4">
    <a class="btn btn-outline-secondary" href="{% url "blog:post_list" %}">К списку статей>></a>
    <a class="btn btn-outline-secondary" href="{% url "blog:index" %}">На главную страницу>>/a>
</div>
{% endblock %}
