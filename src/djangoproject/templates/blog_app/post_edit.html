{% extends "base.html" %}
{% block title %}Редактировать статью{% endblock %}
{% block content %}
<h1>Редактировать статью</h1>
<form method="post">
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div class="alert alert-danger">
            {% for ошибка in form.non_field_errors %}
                <p>{{ ошибка }}</p>
            {% endfor %}
        </div>
    {% endif %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary mt-3">
        Сохранить
    </button>
</form>
{% endblock %}
