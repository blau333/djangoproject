{% extends "base.html" %}
{% block title %}
Создать категорию
{% endblock %}

{% block content %}
<h1>Создать категорию</h1>

<form method="post">
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div class="alert alert-danger">
            {% for ошибка in form.non_field_errors %}
                <p>{{ ошибка }}</p>
            {% endfor %}
        </div>
    {% endif %}

    {{ form.as_p }}
    <button type="submit" class="btn btn-primary mt-3">
        Создать
    </button>

</form>
{% endblock %}
